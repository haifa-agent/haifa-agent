# pa.xiaoniuai.com — Haifa Personal Assistant（Linux 服务器包默认站点模板）
# 按实际域名/证书/目录调整 server_name、ssl_certificate 与 root 后放到
# /etc/nginx/conf.d/pa.conf，然后 nginx -t && systemctl reload nginx。
#
# 关键点：后端 LoopbackRequestFilter 只接受回环 Host，并拒绝非回环 Origin，
# 所以反代必须把 Host 改写为 127.0.0.1:20001 且清空 Origin。

upstream pa_backend {
    server 127.0.0.1:20001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pa.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / { return 301 https://pa.example.com$request_uri; }
}

server {
    # nginx < 1.25.1 用 `listen 443 ssl http2;`；1.25.1+ 用 `listen 443 ssl;` + `http2 on;`
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pa.example.com;

    ssl_certificate /etc/letsencrypt/live/pa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pa.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PaTLS:10m;
    ssl_session_timeout 1d;

    # 直接指向安装目录内的 web/：普通用户安装即可用，不需要 root
    # 若用 PA_WEB_ROOT 把静态文件复制到别处，这里改成对应目录
    root /opt/haifa-personal-assistant/web;
    index index.html;
    # 后端单请求体上限 64KB，图片/音频上传各限 10MB
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # 健康检查只在回环使用，不对外暴露
    location ^~ /actuator/ { return 404; }

    # 运行事件流（SSE）：必须关闭缓冲与缓存
    location ~ ^/api/v1/runs/[^/]+/stream$ {
        proxy_pass http://pa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:20001;
        proxy_set_header Origin "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://pa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:20001;
        proxy_set_header Origin "";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 前端任务规划超时为 190s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /v1/admin/ {
        proxy_pass http://pa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:20001;
        proxy_set_header Origin "";
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 带内容哈希的静态资源可长缓存；入口页不缓存，便于升级后立即生效
    location /assets/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 回退：/admin/ 等前端路由都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 暴露公网时强烈建议启用共享口令 ----
    # htpasswd -c /etc/nginx/pa.htpasswd <user>
    # auth_basic "Haifa Personal Assistant";
    # auth_basic_user_file /etc/nginx/pa.htpasswd;
}
