<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent Coding UI</title></head><body><main><h1>Independent Coding UI</h1><p>从可信 Host 获取配对码。本示例仅提供会话创建与只读观察；审批请在完整客户端处理。</p><form id="pair"><label>一次性配对码 <input id="proof" type="password" autocomplete="off" required></label><button>连接</button></form><p id="status" role="status"></p><button id="refresh" disabled>刷新会话</button><select id="sessions" aria-label="选择会话" disabled><option value="">选择会话</option></select><form id="create"><label>新任务 <textarea id="text" required></textarea></label><button id="send" disabled>创建并开始</button></form><pre id="output" aria-label="权威会话展示"></pre></main><script type="module" src="/src/main.ts"></script></body></html>
