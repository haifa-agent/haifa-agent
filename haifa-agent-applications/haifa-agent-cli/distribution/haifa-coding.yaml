# Portable, secret-free defaults for the Haifa Coding Agent distribution.
# The packaging script renders the two persistence path tokens as absolute paths.
# Secrets are injected through environment variables, never stored in this file.
models:
  default: deepseek-responses-flash
  providers:
    - id: openai-codex
      displayName: ChatGPT Codex
      endpoint: https://chatgpt.com/backend-api/codex
      credentialRef: model-auth://openai-codex/default
      nativeStreaming: true
      originator: ${HAIFA_CODEX_ORIGINATOR:haifa}
      userAgent: ${HAIFA_CODEX_USER_AGENT:haifa-agent/1}
      apiBindings:
        - style: openai-responses
          dialect: openai-codex-responses
      models:
        - id: gpt-5.6-sol
          displayName: GPT-5.6 Sol
          providerModelId: gpt-5.6-sol
          style: openai-responses
          capabilities: [TEXT_CHAT, TOOL_CALLING, REASONING]
          contextWindow: 272000
          maxOutputTokens: 128000
        - id: gpt-5.6-terra
          displayName: GPT-5.6 Terra
          providerModelId: gpt-5.6-terra
          style: openai-responses
          capabilities: [TEXT_CHAT, TOOL_CALLING, REASONING]
          contextWindow: 272000
          maxOutputTokens: 128000
        - id: gpt-5.6-luna
          displayName: GPT-5.6 Luna
          providerModelId: gpt-5.6-luna
          style: openai-responses
          capabilities: [TEXT_CHAT, TOOL_CALLING, REASONING]
          contextWindow: 272000
          maxOutputTokens: 128000
    - id: deepseek
      displayName: DeepSeek
      endpoint: https://api.deepseek.com
      credentialRef: model-auth://deepseek/default
      nativeStreaming: true
      apiBindings:
        - style: openai-chat-completions
          dialect: deepseek-openai-chat
        - style: openai-responses
          dialect: deepseek-openai-responses
        - style: anthropic-messages
          dialect: deepseek-anthropic-messages
          endpoint: https://api.deepseek.com/anthropic
      models:
        - id: deepseek-chat-flash
          displayName: DeepSeek Chat Flash
          providerModelId: deepseek-v4-flash
          style: openai-chat-completions
          capabilities: [TEXT_CHAT, TOOL_CALLING, STRUCTURED_OUTPUT, REASONING]
          contextWindow: 131072
          maxOutputTokens: 8192
        - id: deepseek-chat-pro
          displayName: DeepSeek Chat Pro
          providerModelId: deepseek-v4-pro
          style: openai-chat-completions
          capabilities: [TEXT_CHAT, TOOL_CALLING, STRUCTURED_OUTPUT, REASONING]
          contextWindow: 131072
          maxOutputTokens: 8192
        - id: deepseek-responses-flash
          displayName: DeepSeek Responses Flash
          providerModelId: deepseek-v4-flash
          style: openai-responses
          capabilities: [TEXT_CHAT, TOOL_CALLING, STRUCTURED_OUTPUT, REASONING]
          contextWindow: 131072
          maxOutputTokens: 8192
        - id: deepseek-anthropic-flash
          displayName: DeepSeek Anthropic Messages Flash
          providerModelId: deepseek-v4-flash
          style: anthropic-messages
          capabilities: [TEXT_CHAT, TOOL_CALLING, REASONING]
          contextWindow: 131072
          maxOutputTokens: 8192
    - id: local-openai
      displayName: Local OpenAI Responses Gateway
      endpoint: ${OPENAI_BASE_URL:http://127.0.0.1:30000/v1}
      credentialRef: env://OPENAI_API_KEY
      nativeStreaming: true
      apiBindings:
        - style: openai-responses
      models:
        - id: local-openai-responses
          displayName: Local OpenAI Responses
          providerModelId: ${OPENAI_MODEL_ID:gpt-5.6-luna}
          style: openai-responses
          capabilities: [TEXT_CHAT]
          contextWindow: 131072
          maxOutputTokens: 8192
    - id: cliproxyapi-antigravity
      displayName: Local CLIProxyAPI Antigravity Dialect
      endpoint: ${HAIFA_CLIPROXYAPI_ENDPOINT:http://127.0.0.1:8317/v1beta}
      credentialRef: env://HAIFA_CLIPROXYAPI_API_KEY
      nativeStreaming: true
      apiBindings:
        - style: google-gemini-generate-content
          dialect: cliproxyapi-antigravity
      models:
        - id: cliproxyapi-gemini
          displayName: Gemini via Local CLIProxyAPI Antigravity Dialect
          providerModelId: ${HAIFA_CLIPROXYAPI_MODEL:gemini-3-flash}
          style: google-gemini-generate-content
          capabilities: [TEXT_CHAT, TOOL_CALLING, STRUCTURED_OUTPUT, REASONING, IMAGE_UPLOAD_INPUT]
          contextWindow: 131072
          maxOutputTokens: 8192
    - id: google-antigravity
      displayName: Google Antigravity Direct (Local Compatibility)
      endpoint: ${HAIFA_ANTIGRAVITY_MODEL_ENDPOINT:https://daily-cloudcode-pa.googleapis.com/v1internal}
      credentialRef: model-auth://google-antigravity/default
      nativeStreaming: true
      apiBindings:
        - style: google-gemini-generate-content
          dialect: antigravity-direct
      models:
        - id: antigravity-gemini
          displayName: Gemini via Antigravity Direct (UNOFFICIAL_LOCAL_COMPAT)
          providerModelId: ${HAIFA_ANTIGRAVITY_MODEL:gemini-3-flash}
          style: google-gemini-generate-content
          capabilities: [TEXT_CHAT, TOOL_CALLING, STRUCTURED_OUTPUT, REASONING, IMAGE_UPLOAD_INPUT]
          contextWindow: 131072
          maxOutputTokens: 8192

tools:
  enabled:
    - file.list
    - file.stat
    - file.read
    - file.create
    - file.write
    - file.patch
    - file.delete
    - file.move
    - execution.run

skills:
  allowed:
    - task-planning
    - result-verification
    - git
    - github
    - git-delivery

approval:
  mode: ask
  threshold: low

execution:
  provider: host-guarded
  network: allow
  shell: auto
  defaultTimeoutMillis: 120000
  maxTimeoutMillis: 1800000
  maxOutputLines: 2000
  maxOutputBytes: 51200
  maxProcesses: 8
  inheritEnvironment:
    - "*"
  extraPathPolicies: []

runtime:
  maxIterations: 50
  maxToolCalls: 32
  maxWallTimeMillis: 300000

persistence:
  mode: SQLITE_WITH_JSONL
  databasePath: __HAIFA_SQLITE_DATABASE_PATH__
  transcriptRoot: __HAIFA_TRANSCRIPT_ROOT__
  # Payload protection options:
  #   protection: NONE
  #   protection: AES_GCM
  #   protectorRef: env://HAIFA_CONTINUATION_KEY
  protection: NONE
  busyTimeoutMillis: 5000
  maximumPayloadBytes: 1048576
