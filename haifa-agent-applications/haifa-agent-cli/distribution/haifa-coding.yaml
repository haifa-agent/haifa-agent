# Portable, secret-free defaults for the Haifa Coding Agent distribution.
# The packaging script renders the two persistence path tokens as absolute paths.
# Secrets are injected through environment variables, never stored in this file.
models:
  default: deepseek-v4-flash
  providers:
    - id: deepseek
      displayName: DeepSeek
      dialectId: deepseek-openai-chat
      dialectVersion: "1.0"
      nativeStreaming: true
      endpoint: https://api.deepseek.com
      credentialRef: env://DEEPSEEK_API_KEY
      models:
        - id: deepseek-v4-flash
          displayName: DeepSeek V4 Flash
          providerModelId: deepseek-v4-flash
        - id: deepseek-v4-pro
          displayName: DeepSeek V4 Pro
          providerModelId: deepseek-v4-pro
    - id: openai
      displayName: OpenAI
      dialectId: openai-chat-completions
      dialectVersion: "1.0"
      nativeStreaming: false
      endpoint: http://localhost:30000/v1
      credentialRef: env://OPENAI_API_KEY
      models:
        - id: openai-gpt-5.6-luna
          displayName: GPT-5.6 Luna
          providerModelId: gpt-5.6-luna

tools:
  enabled:
    - file.list
    - file.stat
    - file.read
    - file.create
    - file.write
    - file.patch
    - file.delete
    - file.move
    - execution.run

skills:
  allowed:
    - task-planning
    - result-verification

approval:
  mode: ask

execution:
  provider: host-guarded
  network: allow
  shell: auto
  defaultTimeoutMillis: 120000
  maxTimeoutMillis: 1800000
  maxOutputLines: 2000
  maxOutputBytes: 51200
  maxProcesses: 8
  inheritEnvironment:
    - PATH
    - HOME
    - USERPROFILE
    - TMP
    - TEMP
    - SystemRoot
    - SystemDrive
    - WINDIR
    - ComSpec
    - HOMEDRIVE
    - HOMEPATH
    - APPDATA
    - LOCALAPPDATA
    - ProgramData
    - ProgramFiles
    - ProgramW6432
    - PUBLIC
    - PSModulePath
    - JAVA_HOME
    - MAVEN_OPTS
    - GRADLE_USER_HOME
  extraPathPolicies: []

runtime:
  maxIterations: 50
  maxToolCalls: 32
  maxWallTimeMillis: 300000

persistence:
  mode: SQLITE_WITH_JSONL
  databasePath: __HAIFA_SQLITE_DATABASE_PATH__
  transcriptRoot: __HAIFA_TRANSCRIPT_ROOT__
  # Payload protection options:
  #   protection: NONE
  #   protection: AES_GCM
  #   protectorRef: env://HAIFA_CONTINUATION_KEY
  protection: NONE
  busyTimeoutMillis: 5000
  maximumPayloadBytes: 1048576
