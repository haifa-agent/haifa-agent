          capabilities: [TEXT_CHAT, TOOL_CALLING, REASONING]
          contextWindow: 131072
          maxOutputTokens: 8192
    - id: local-openai
      displayName: Local OpenAI Responses Gateway
      endpoint: ${OPENAI_BASE_URL:http://127.0.0.1:30000/v1}
