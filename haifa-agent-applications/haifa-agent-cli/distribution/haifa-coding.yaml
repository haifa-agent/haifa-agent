# Portable, secret-free defaults for the Haifa Coding Agent distribution.
# Catalog owns provider/model metadata, dialects, capabilities and limits. This file owns only deployment.
models:
  default: deepseek-responses-flash
  providers:
    - id: deepseek
      endpoint: https://api.deepseek.com
      credentialRef: model-auth://deepseek/default
      nativeStreaming: true
      allowedBindings: [deepseek-chat-pro, deepseek-chat-flash, deepseek-responses-flash, deepseek-responses-pro, deepseek-anthropic-flash, deepseek-anthropic-pro]
      bindingEndpointOverrides:
        deepseek-anthropic-flash: https://api.deepseek.com/anthropic
        deepseek-anthropic-pro: https://api.deepseek.com/anthropic
    - id: openai-codex
      endpoint: https://chatgpt.com/backend-api/codex
      credentialRef: model-auth://openai-codex/default
      nativeStreaming: true
      originator: ${HAIFA_CODEX_ORIGINATOR:haifa}
      userAgent: ${HAIFA_CODEX_USER_AGENT:haifa-agent/1}
      allowedBindings: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
    - id: aliyun-bailian
      endpoint: https://default-workspace.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      credentialRef: env://DASHSCOPE_API_KEY
      nativeStreaming: true
      workspaceId: ${HAIFA_BAILIAN_WORKSPACE_ID:default-workspace}
      region: ${HAIFA_BAILIAN_REGION:cn-beijing}
      allowedBindings: [qwen3.8-max-0902, qwen3.8-max, qwen3.8-flash, qwen3.7-plus, qwen3-vl-plus]
      reasoningMode: ENABLED
    - id: siliconflow
      endpoint: https://api.siliconflow.cn/v1
      credentialRef: env://SILICONFLOW_API_KEY
      nativeStreaming: true
      allowedBindings: [siliconflow-deepseek-v4-pro, siliconflow-deepseek-v4-flash, siliconflow-qwen3-vl-32b, siliconflow-qwen3-32b, siliconflow-kimi-k3, siliconflow-kimi-k2-6, siliconflow-glm-5-2, siliconflow-glm-5-1]
      reasoningMode: ENABLED
    - id: kimi
      endpoint: https://api.moonshot.cn/v1
      credentialRef: env://KIMI_API_KEY
      nativeStreaming: true
      allowedBindings: [kimi-k3, kimi-k2.7-code, kimi-k2.6]
      reasoningMode: ENABLED
    - id: zhipu
      endpoint: https://open.bigmodel.cn/api/paas/v4
      credentialRef: env://BIGMODEL_API_KEY
      nativeStreaming: true
      allowedBindings: [glm-5.2, glm-5.1, glm-5, glm-5-turbo]
      reasoningMode: ENABLED
    - id: google-antigravity
      endpoint: ${HAIFA_ANTIGRAVITY_MODEL_ENDPOINT:https://daily-cloudcode-pa.googleapis.com/v1internal}
      credentialRef: model-auth://google-antigravity/default
      nativeStreaming: true
      allowedBindings: [antigravity-gemini]
tools:
  enabled: [file.list, file.stat, file.read, file.create, file.write, file.patch, file.delete, file.move, execution.run]
skills:
  allowed: [task-planning, result-verification, git, github, git-delivery]
approval:
  mode: ask
  threshold: low
execution:
  provider: host-guarded
  network: allow
  shell: auto
  defaultTimeoutMillis: 120000
  maxTimeoutMillis: 1800000
  maxOutputLines: 2000
  maxOutputBytes: 51200
  maxProcesses: 8
  inheritEnvironment: ["*"]
  extraPathPolicies: []
runtime:
  maxIterations: 50
  maxToolCalls: 32
  maxWallTimeMillis: 300000
persistence:
  mode: SQLITE_WITH_JSONL
  databasePath: __HAIFA_SQLITE_DATABASE_PATH__
  transcriptRoot: __HAIFA_TRANSCRIPT_ROOT__
  protection: NONE
  busyTimeoutMillis: 5000
  maximumPayloadBytes: 1048576
