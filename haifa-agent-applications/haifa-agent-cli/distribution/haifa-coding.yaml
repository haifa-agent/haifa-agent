tools:
  enabled:
    - file.list
    - file.stat
    - file.read
    - file.create
    - file.write
    - file.patch
    - file.delete
    - file.move
    - execution.run

skills:
  allowed:
    - task-planning
    - result-verification
    - git
    - github
    - git-delivery

approval:
  mode: ask
  threshold: low

execution:
  provider: host-guarded
  network: allow
  shell: auto
  defaultTimeoutMillis: 120000
  maxTimeoutMillis: 1800000
  maxOutputLines: 2000
  maxOutputBytes: 51200
  maxProcesses: 8
  inheritEnvironment:
    - "*"
  extraPathPolicies: []

runtime:
  maxIterations: 50
  maxToolCalls: 32
  maxWallTimeMillis: 300000

persistence:
  mode: SQLITE_WITH_JSONL
  databasePath: __HAIFA_SQLITE_DATABASE_PATH__
  transcriptRoot: __HAIFA_TRANSCRIPT_ROOT__
  # Payload protection options:
  #   protection: NONE
  #   protection: AES_GCM
  #   protectorRef: env://HAIFA_CONTINUATION_KEY
  protection: NONE
  busyTimeoutMillis: 5000
  maximumPayloadBytes: 1048576
