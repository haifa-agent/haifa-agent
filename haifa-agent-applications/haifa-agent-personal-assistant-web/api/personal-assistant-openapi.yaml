openapi: 3.1.0
info:
  title: Haifa Personal Assistant Web API
  version: 0.1.0
  summary: Web MVP contract; backend implementation is intentionally deferred.
  description: |
    Product API over the future HAIFA-ARCH-020 SDK, Conversation, Memory and
    Artifact foundations. The server injects the trusted caller. Request bodies
    never accept tenant, principal, reviewer or product profile identifiers.
servers:
  - url: http://127.0.0.1:20000
    description: Local host MVP and frontend mock origin
tags:
  - name: Bootstrap
  - name: Conversations
  - name: Runs
  - name: Interactions
  - name: Events
  - name: Preferences
  - name: Memory
  - name: Artifacts
paths:
  /api/v1/bootstrap:
    get:
      tags: [Bootstrap]
      operationId: bootstrap
      summary: Load the authorized initial application snapshot.
      responses:
        "200":
          description: Product header, preferences, conversation page and counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapView"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List or search authorized conversations with stable cursor pagination.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: query
          in: query
          schema:
            type: string
            maxLength: 120
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Conversation page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Conversations]
      operationId: startConversation
      summary: Atomically start a conversation and its first turn.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationCommand"
      responses:
        "202":
          description: Conversation and first run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationCommandReceipt"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get an authorized conversation snapshot.
      responses:
        "200":
          description: Authorized conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationView"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Conversations]
      operationId: updateConversation
      summary: Rename, archive or unarchive a conversation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationCommand"
      responses:
        "200":
          description: Updated conversation summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/conversations/{conversationId}/turns:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      operationId: listConversationTurns
      summary: Page safe, authorized conversation turns.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Turn page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Conversations]
      operationId: submitTurn
      summary: Submit a next turn only when no active run exists.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTurnCommand"
      responses:
        "202":
          description: Next run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationCommandReceipt"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/conversations/{conversationId}/follow-ups:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      operationId: enqueueFollowUp
      summary: Queue a message as the next turn while a run is active.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpCommand"
      responses:
        "202":
          description: Follow-up durably queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUpReceipt"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get an authorized, safe run view.
      responses:
        "200":
          description: Run snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunView"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}/inputs:steer:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Runs]
      operationId: steerRun
      summary: Submit an explicit input for the current run safe point.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SteerRunCommand"
      responses:
        "202":
          description: Input accepted; applied state follows via snapshot or event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunInputReceipt"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}:cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Request cancellation without promising external side-effect rollback.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancellation request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCommandReceipt"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/interactions/{interactionId}:
    parameters:
      - $ref: "#/components/parameters/InteractionId"
    get:
      tags: [Interactions]
      operationId: getInteraction
      summary: Get an authorized pending or settled interaction.
      responses:
        "200":
          description: Interaction view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionView"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/interactions/{interactionId}:respond:
    parameters:
      - $ref: "#/components/parameters/InteractionId"
    post:
      tags: [Interactions]
      operationId: respondToInteraction
      summary: Respond once to a clarification or approval.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionResponseCommand"
      responses:
        "202":
          description: Response accepted; applied state is not implied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionResponseReceipt"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/conversations/{conversationId}/events:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Events]
      operationId: listConversationEvents
      summary: Page safe events after an exclusive cursor.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Safe event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "409":
          description: Retention gap; reload the conversation snapshot.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/conversations/{conversationId}/events:stream:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Events]
      operationId: subscribeToConversationEvents
      summary: Subscribe to safe events from an exclusive cursor.
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: text/event-stream with id, event and JSON data fields.
          content:
            text/event-stream:
              schema:
                type: string
        "409":
          description: Retention gap; reload the snapshot.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/preferences:
    get:
      tags: [Preferences]
      operationId: getPreferences
      summary: Read Personal preferences; these are not Product Profile fields.
      responses:
        "200":
          description: Preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceView"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Preferences]
      operationId: updatePreferences
      summary: Update bounded preferences for future runs.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferenceCommand"
      responses:
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceView"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/memory-candidates:
    get:
      tags: [Memory]
      operationId: listMemoryCandidates
      summary: List authorized memory candidates with stable pagination.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, EXPIRED]
      responses:
        "200":
          description: Candidate page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCandidatePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/memory-candidates/{candidateId}:revise:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      tags: [Memory]
      operationId: reviseMemoryCandidate
      summary: Revise a pending candidate before explicit approval.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseMemoryCandidateCommand"
      responses:
        "200":
          description: Revised pending candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCandidateView"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/memory-candidates/{candidateId}:approve:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      tags: [Memory]
      operationId: approveMemoryCandidate
      summary: Explicitly approve a pending candidate as a trusted reviewer.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Approved immutable memory version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryView"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/memory-candidates/{candidateId}:reject:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      tags: [Memory]
      operationId: rejectMemoryCandidate
      summary: Reject a pending candidate.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Candidate rejected.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/memories:
    get:
      tags: [Memory]
      operationId: listMemories
      summary: List authorized active or inactive immutable memories.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
      responses:
        "200":
          description: Memory page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/memories/{memoryId}:invalidate:
    parameters:
      - $ref: "#/components/parameters/MemoryId"
    post:
      tags: [Memory]
      operationId: invalidateMemory
      summary: Stop using an immutable memory in future runs.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Memory invalidated.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/memories/{memoryId}:purge:
    parameters:
      - $ref: "#/components/parameters/MemoryId"
    post:
      tags: [Memory]
      operationId: purgeMemory
      summary: Irreversibly purge protected content and retain only a tombstone.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Memory purged.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/artifacts:
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      summary: List authorized artifacts with stable cursor pagination.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: conversationId
          in: query
          schema:
            $ref: "#/components/schemas/OpaqueId"
      responses:
        "200":
          description: Artifact page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/artifacts/{artifactId}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
      - $ref: "#/components/parameters/ArtifactVersion"
    get:
      tags: [Artifacts]
      operationId: getArtifact
      summary: Get authorized artifact metadata and content capabilities.
      responses:
        "200":
          description: Artifact metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactView"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/artifacts/{artifactId}/versions/{version}/content:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
      - $ref: "#/components/parameters/ArtifactVersion"
    get:
      tags: [Artifacts]
      operationId: openArtifactContent
      summary: Open authorized content without exposing a host path.
      parameters:
        - name: disposition
          in: query
          schema:
            type: string
            enum: [inline, attachment]
            default: attachment
        - name: Range
          in: header
          required: false
          schema:
            type: string
            maxLength: 96
      responses:
        "200":
          description: Full content with verified Content-Type, Content-Length and ETag.
          headers:
            ETag:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        "206":
          description: Partial content only when the content handle supports ranges.
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque key bound to the canonical request digest.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current numeric revision, for example "7".
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    InteractionId:
      name: interactionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ArtifactVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Error:
      description: Stable safe error; unauthorized and absent resources are indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9._~-]+$"
    IsoInstant:
      type: string
      format: date-time
    SafeTextPart:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          const: text
        text:
          type: string
          maxLength: 32000
    TextInput:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/SafeTextPart"
    ProductView:
      type: object
      additionalProperties: false
      required: [name, assistantName, locale, principalLabel]
      properties:
        name:
          type: string
          const: Haifa Personal Assistant
        assistantName:
          type: string
          maxLength: 32
        locale:
          type: string
          example: zh-CN
        principalLabel:
          type: string
          const: 公共用户
    BootstrapView:
      type: object
      additionalProperties: false
      required: [product, preferences, conversations, memoryCandidateCount, serverTime]
      properties:
        product:
          $ref: "#/components/schemas/ProductView"
        preferences:
          $ref: "#/components/schemas/PreferenceView"
        conversations:
          $ref: "#/components/schemas/ConversationPage"
        memoryCandidateCount:
          type: integer
          minimum: 0
        serverTime:
          $ref: "#/components/schemas/IsoInstant"
    ConversationStatus:
      type: string
      enum: [IDLE, RUNNING, WAITING_INTERACTION, WAITING_APPROVAL, COMPLETED, FAILED, CANCELLED]
    ConversationSummary:
      type: object
      additionalProperties: false
      required: [id, title, status, archived, revision, createdAt, updatedAt, lastActivityAt]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        title:
          type: string
          minLength: 1
          maxLength: 120
        preview:
          type: string
          maxLength: 240
        status:
          $ref: "#/components/schemas/ConversationStatus"
        archived:
          type: boolean
        activeRunId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        revision:
          type: integer
          minimum: 1
        createdAt:
          $ref: "#/components/schemas/IsoInstant"
        updatedAt:
          $ref: "#/components/schemas/IsoInstant"
        lastActivityAt:
          $ref: "#/components/schemas/IsoInstant"
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ConversationSummary"
        nextCursor:
          type: [string, "null"]
          maxLength: 512
        hasMore:
          type: boolean
    StartConversationCommand:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          $ref: "#/components/schemas/TextInput"
    SubmitTurnCommand:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          $ref: "#/components/schemas/TextInput"
    FollowUpCommand:
      type: object
      additionalProperties: false
      required: [input, activeRunId]
      properties:
        input:
          $ref: "#/components/schemas/TextInput"
        activeRunId:
          $ref: "#/components/schemas/OpaqueId"
    SteerRunCommand:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          $ref: "#/components/schemas/TextInput"
    UpdateConversationCommand:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        archived:
          type: boolean
      minProperties: 1
    ConversationCommandReceipt:
      type: object
      additionalProperties: false
      required: [conversationId, runId, revision, acceptedAt]
      properties:
        conversationId:
          $ref: "#/components/schemas/OpaqueId"
        runId:
          $ref: "#/components/schemas/OpaqueId"
        revision:
          type: integer
          minimum: 1
        acceptedAt:
          $ref: "#/components/schemas/IsoInstant"
    FollowUpReceipt:
      type: object
      additionalProperties: false
      required: [followUpId, conversationId, state, acceptedAt]
      properties:
        followUpId:
          $ref: "#/components/schemas/OpaqueId"
        conversationId:
          $ref: "#/components/schemas/OpaqueId"
        state:
          type: string
          enum: [QUEUED, DISPATCHING, COMPLETED, CANCELLED]
        acceptedAt:
          $ref: "#/components/schemas/IsoInstant"
    RunInputReceipt:
      type: object
      additionalProperties: false
      required: [inputId, runId, state, acceptedAt]
      properties:
        inputId:
          $ref: "#/components/schemas/OpaqueId"
        runId:
          $ref: "#/components/schemas/OpaqueId"
        state:
          type: string
          enum: [ACCEPTED, APPLIED, INVALIDATED]
        acceptedAt:
          $ref: "#/components/schemas/IsoInstant"
    RunCommandReceipt:
      type: object
      additionalProperties: false
      required: [runId, accepted, acceptedAt]
      properties:
        runId:
          $ref: "#/components/schemas/OpaqueId"
        accepted:
          type: boolean
        acceptedAt:
          $ref: "#/components/schemas/IsoInstant"
    MessageView:
      type: object
      additionalProperties: false
      required: [id, role, parts, occurredAt, committed]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        role:
          type: string
          enum: [USER, ASSISTANT, SYSTEM]
        parts:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/SafeTextPart"
        runId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        occurredAt:
          $ref: "#/components/schemas/IsoInstant"
        committed:
          type: boolean
    TurnPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MessageView"
        nextCursor:
          type: [string, "null"]
          maxLength: 512
        hasMore:
          type: boolean
    RunStatus:
      type: string
      enum: [ACCEPTED, QUEUED, RUNNING, WAITING_INTERACTION, WAITING_APPROVAL, SUSPENDED, COMPLETING, COMPLETED, FAILED, CANCELLED, TIMEOUT]
    TaskStepView:
      type: object
      additionalProperties: false
      required: [id, title, state]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        title:
          type: string
          maxLength: 160
        state:
          type: string
          enum: [PENDING, ACTIVE, COMPLETED, BLOCKED, FAILED]
    ActivityView:
      type: object
      additionalProperties: false
      required: [id, title, kind, state, occurredAt]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        title:
          type: string
          maxLength: 160
        detail:
          type: string
          maxLength: 500
        kind:
          type: string
          enum: [STATUS, TOOL, SKILL, MCP, APPROVAL, CLARIFICATION, ARTIFACT]
        state:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED, REJECTED]
        occurredAt:
          $ref: "#/components/schemas/IsoInstant"
    RunView:
      type: object
      additionalProperties: false
      required: [id, conversationId, status, title, startedAt, steps, activity]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        conversationId:
          $ref: "#/components/schemas/OpaqueId"
        status:
          $ref: "#/components/schemas/RunStatus"
        title:
          type: string
          maxLength: 160
        startedAt:
          $ref: "#/components/schemas/IsoInstant"
        completedAt:
          oneOf:
            - $ref: "#/components/schemas/IsoInstant"
            - type: "null"
        steps:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TaskStepView"
        activity:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ActivityView"
        pendingInteractionId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
    InteractionView:
      type: object
      additionalProperties: false
      required: [id, runId, type, state, title, detail, revision, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        runId:
          $ref: "#/components/schemas/OpaqueId"
        type:
          type: string
          enum: [CLARIFICATION, APPROVAL]
        state:
          type: string
          enum: [PENDING, RESPONDED, APPLIED, EXPIRED, INVALIDATED]
        title:
          type: string
          maxLength: 160
        detail:
          type: string
          maxLength: 2000
        targetSummary:
          type: string
          maxLength: 500
        riskSummary:
          type: string
          maxLength: 500
        options:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [id, label]
            properties:
              id:
                $ref: "#/components/schemas/OpaqueId"
              label:
                type: string
                maxLength: 120
        revision:
          type: integer
          minimum: 1
        expiresAt:
          $ref: "#/components/schemas/IsoInstant"
    InteractionResponseCommand:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT, ANSWER]
        optionId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        answer:
          type: [string, "null"]
          maxLength: 2000
        approvalScope:
          type: string
          enum: [ONCE, SESSION]
          default: ONCE
    InteractionResponseReceipt:
      type: object
      additionalProperties: false
      required: [interactionId, responseId, state, acceptedAt]
      properties:
        interactionId:
          $ref: "#/components/schemas/OpaqueId"
        responseId:
          $ref: "#/components/schemas/OpaqueId"
        state:
          type: string
          enum: [ACCEPTED, APPLIED]
        acceptedAt:
          $ref: "#/components/schemas/IsoInstant"
    TokenUsageView:
      type: object
      additionalProperties: false
      description: >
        Conversation-level cumulative model usage. Values are aggregated only
        from usage reported by model providers; the server must not estimate
        tokens from text length. modelCalls can be greater than
        providerReportedModelCalls when a provider omits usage.
      required:
        - inputTokens
        - outputTokens
        - totalTokens
        - cacheReadInputTokens
        - modelCalls
        - providerReportedModelCalls
        - updatedAt
      properties:
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        totalTokens:
          type: integer
          format: int64
          minimum: 0
          description: Provider-reported inputTokens plus outputTokens.
        cacheReadInputTokens:
          type: integer
          format: int64
          minimum: 0
        modelCalls:
          type: integer
          minimum: 0
        providerReportedModelCalls:
          type: integer
          minimum: 0
        updatedAt:
          $ref: "#/components/schemas/IsoInstant"
    ConversationView:
      type: object
      additionalProperties: false
      required: [summary, messages, eventCursor]
      properties:
        summary:
          $ref: "#/components/schemas/ConversationSummary"
        messages:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/MessageView"
        run:
          oneOf:
            - $ref: "#/components/schemas/RunView"
            - type: "null"
        interaction:
          oneOf:
            - $ref: "#/components/schemas/InteractionView"
            - type: "null"
        artifacts:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ArtifactView"
        tokenUsage:
          oneOf:
            - $ref: "#/components/schemas/TokenUsageView"
            - type: "null"
        eventCursor:
          type: string
          maxLength: 512
    PreferenceView:
      type: object
      additionalProperties: false
      required: [assistantName, responseStyle, detailLevel, locale, proactiveSuggestions, memoryEnabled, revision]
      properties:
        assistantName:
          type: string
          minLength: 1
          maxLength: 32
        responseStyle:
          type: string
          enum: [PRACTICAL, WARM, PROFESSIONAL]
        detailLevel:
          type: integer
          minimum: 1
          maximum: 5
        locale:
          type: string
          enum: [zh-CN, en-US]
        proactiveSuggestions:
          type: boolean
        memoryEnabled:
          type: boolean
        revision:
          type: integer
          minimum: 1
    UpdatePreferenceCommand:
      type: object
      additionalProperties: false
      properties:
        assistantName:
          type: string
          minLength: 1
          maxLength: 32
        responseStyle:
          type: string
          enum: [PRACTICAL, WARM, PROFESSIONAL]
        detailLevel:
          type: integer
          minimum: 1
          maximum: 5
        locale:
          type: string
          enum: [zh-CN, en-US]
        proactiveSuggestions:
          type: boolean
        memoryEnabled:
          type: boolean
      minProperties: 1
    MemoryCandidateView:
      type: object
      additionalProperties: false
      required: [id, content, reason, sourceConversationTitle, status, revision, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        content:
          type: string
          maxLength: 4000
        reason:
          type: string
          maxLength: 500
        sourceConversationTitle:
          type: string
          maxLength: 120
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED]
        revision:
          type: integer
          minimum: 1
        createdAt:
          $ref: "#/components/schemas/IsoInstant"
        updatedAt:
          $ref: "#/components/schemas/IsoInstant"
    MemoryCandidatePage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MemoryCandidateView"
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
    ReviseMemoryCandidateCommand:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
    MemoryView:
      type: object
      additionalProperties: false
      required: [id, version, content, category, source, state, revision, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        version:
          type: integer
          minimum: 1
        content:
          type: string
          maxLength: 4000
        category:
          type: string
          maxLength: 64
        source:
          type: string
          maxLength: 160
        state:
          type: string
          enum: [ACTIVE, INACTIVE]
        revision:
          type: integer
          minimum: 1
        updatedAt:
          $ref: "#/components/schemas/IsoInstant"
    MemoryPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MemoryView"
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
    ArtifactView:
      type: object
      additionalProperties: false
      required: [id, version, name, mediaType, byteCount, description, createdAt, previewMode]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        version:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 180
        mediaType:
          type: string
          maxLength: 160
        byteCount:
          type: integer
          minimum: 0
        description:
          type: string
          maxLength: 500
        createdAt:
          $ref: "#/components/schemas/IsoInstant"
        previewMode:
          type: string
          enum: [SAFE_INLINE, DOWNLOAD_ONLY, NONE]
        contentHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
    ArtifactPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ArtifactView"
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
    ClientEvent:
      type: object
      additionalProperties: false
      required: [id, type, sequence, occurredAt, payload]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        type:
          type: string
          enum:
            - run.status.changed
            - assistant.output.started
            - assistant.text.delta
            - assistant.text.committed
            - assistant.output.failed
            - interaction.requested
            - interaction.responded
            - interaction.expired
            - run.input.accepted
            - run.input.applied
            - task.steps.changed
            - activity.changed
            - artifact.published
            - token.usage.updated
        sequence:
          type: integer
          minimum: 1
        occurredAt:
          $ref: "#/components/schemas/IsoInstant"
        payload:
          type: object
          additionalProperties: true
          maxProperties: 32
    EventPage:
      type: object
      additionalProperties: false
      required: [items, cursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ClientEvent"
        cursor:
          type: string
          maxLength: 512
        hasMore:
          type: boolean
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 160
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - IDEMPOTENCY_CONFLICT
            - STALE_REVISION
            - ACTIVE_RUN_CONFLICT
            - RESOURCE_NOT_FOUND
            - INTERACTION_UNAVAILABLE
            - RETENTION_GAP
            - CONTENT_UNAVAILABLE
            - CAPABILITY_UNAVAILABLE
            - SERVICE_UNAVAILABLE
        detail:
          type: string
          maxLength: 500
        correlationId:
          $ref: "#/components/schemas/OpaqueId"
