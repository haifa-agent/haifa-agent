server:
  address: 127.0.0.1
  port: 20001
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: haifa-personal-assistant
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  level:
    io.haifa.agent.personalassistant.server.observability: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{48} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

haifa:
  personal:
    data-directory: ${HAIFA_PERSONAL_DATA_DIR:./data/personal-assistant}
    continuation-key-base64: ${HAIFA_PERSONAL_CONTINUATION_KEY:}
    caller:
      tenant: ${HAIFA_PERSONAL_TENANT:local}
      principal: ${HAIFA_PERSONAL_PRINCIPAL:public-user}
      reviewer: ${HAIFA_PERSONAL_REVIEWER:public-user}
    model-providers:
      - id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_ID:deepseek}
        display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_DISPLAYNAME:DeepSeek}
        mode: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODE:remote}
        allow-deterministic: ${HAIFA_PERSONAL_MODELPROVIDERS_0_ALLOWDETERMINISTIC:false}
        dialect-id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_DIALECTID:deepseek-openai-chat}
        dialect-version: ${HAIFA_PERSONAL_MODELPROVIDERS_0_DIALECTVERSION:1.0}
        native-streaming: ${HAIFA_PERSONAL_MODELPROVIDERS_0_NATIVESTREAMING:true}
        endpoint: ${HAIFA_PERSONAL_MODELPROVIDERS_0_ENDPOINT:https://api.deepseek.com}
        credential-reference: ${HAIFA_PERSONAL_MODELPROVIDERS_0_CREDENTIALREFERENCE:env://DEEPSEEK_API_KEY}
        models:
          - id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_0_ID:deepseek-v4-pro}
            display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_0_DISPLAYNAME:DeepSeek V4 Pro}
            provider-model-id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_0_PROVIDERMODELID:deepseek-v4-pro}
          - id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_1_ID:deepseek-v4-flash}
            display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_1_DISPLAYNAME:DeepSeek V4 Flash}
            provider-model-id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_1_PROVIDERMODELID:deepseek-v4-flash}
      - id: ${HAIFA_PERSONAL_MODELPROVIDERS_1_ID:openai}
        display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_1_DISPLAYNAME:OpenAI}
        mode: ${HAIFA_PERSONAL_MODELPROVIDERS_1_MODE:remote}
        allow-deterministic: ${HAIFA_PERSONAL_MODELPROVIDERS_1_ALLOWDETERMINISTIC:false}
        dialect-id: ${HAIFA_PERSONAL_MODELPROVIDERS_1_DIALECTID:openai-chat-completions}
        dialect-version: ${HAIFA_PERSONAL_MODELPROVIDERS_1_DIALECTVERSION:1.0}
        native-streaming: ${HAIFA_PERSONAL_MODELPROVIDERS_1_NATIVESTREAMING:false}
        endpoint: ${HAIFA_PERSONAL_MODELPROVIDERS_1_ENDPOINT:http://localhost:30000/v1}
        credential-reference: ${HAIFA_PERSONAL_MODELPROVIDERS_1_CREDENTIALREFERENCE:env://OPENAI_API_KEY}
        models:
          - id: ${HAIFA_PERSONAL_MODELPROVIDERS_1_MODELS_0_ID:openai-gpt-5.6-luna}
            display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_1_MODELS_0_DISPLAYNAME:GPT-5.6 Luna}
            provider-model-id: ${HAIFA_PERSONAL_MODELPROVIDERS_1_MODELS_0_PROVIDERMODELID:gpt-5.6-luna}
    default-model-id: ${HAIFA_PERSONAL_DEFAULT_MODEL_ID:deepseek-v4-flash}
    allow-insecure-loopback-model: ${HAIFA_PERSONAL_ALLOW_INSECURE_LOOPBACK_MODEL:true}
    web:
      enabled: ${HAIFA_PERSONAL_WEB_ENABLED:false}
      credential-reference: ${HAIFA_PERSONAL_WEB_CREDENTIAL:env://ALIYUN_IQS_API_KEY}
      timeout-millis: ${HAIFA_PERSONAL_WEB_TIMEOUT_MILLIS:30000}
      search-maximum-response-bytes: ${HAIFA_PERSONAL_WEB_SEARCH_MAXIMUM_RESPONSE_BYTES:2097152}
      fetch-maximum-response-bytes: ${HAIFA_PERSONAL_WEB_FETCH_MAXIMUM_RESPONSE_BYTES:4194304}
    mcp:
      mode: ${HAIFA_PERSONAL_MCP_MODE:embedded-echo}
      address: 127.0.0.1
      port: ${HAIFA_PERSONAL_MCP_PORT:20002}
      endpoint: ${HAIFA_PERSONAL_MCP_ENDPOINT:http://127.0.0.1:20002/mcp}
      allowed-tools: ${HAIFA_PERSONAL_MCP_ALLOWED_TOOLS:echo}
      alias-namespace: ${HAIFA_PERSONAL_MCP_ALIAS_NAMESPACE:personal_mcp}
      server-id: ${HAIFA_PERSONAL_MCP_SERVER_ID:personal-local}
      display-name: ${HAIFA_PERSONAL_MCP_DISPLAY_NAME:Personal local utility}
    execution:
      default-timeout-millis: ${HAIFA_PERSONAL_EXECUTION_DEFAULT_TIMEOUT_MILLIS:15000}
      maximum-timeout-millis: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_TIMEOUT_MILLIS:30000}
      maximum-output-bytes: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_OUTPUT_BYTES:65536}
      maximum-output-lines: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_OUTPUT_LINES:1000}
      maximum-processes: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_PROCESSES:4}
      trusted-host-enabled: ${HAIFA_PERSONAL_EXECUTION_TRUSTED_HOST_ENABLED:false}
      python-path: ${HAIFA_PERSONAL_PYTHON_PATH:}
      power-shell-path: ${HAIFA_PERSONAL_POWERSHELL_PATH:}
    local-skill-root: ${HAIFA_PERSONAL_SKILL_ROOT:}
    trusted-script-manifest: ${HAIFA_PERSONAL_TRUSTED_SCRIPT_MANIFEST:}
