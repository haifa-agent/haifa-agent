      maximum-output-bytes: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_OUTPUT_BYTES:65536}
      maximum-output-lines: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_OUTPUT_LINES:1000}
      maximum-processes: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_PROCESSES:4}
      trusted-host-enabled: ${HAIFA_PERSONAL_EXECUTION_TRUSTED_HOST_ENABLED:false}
      python-path: ${HAIFA_PERSONAL_PYTHON_PATH:}
      power-shell-path: ${HAIFA_PERSONAL_POWERSHELL_PATH:}
    local-skill-root: ${HAIFA_PERSONAL_SKILL_ROOT:}
    trusted-script-manifest: ${HAIFA_PERSONAL_TRUSTED_SCRIPT_MANIFEST:}
