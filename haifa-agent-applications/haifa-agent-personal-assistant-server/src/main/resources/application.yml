server:
  address: 127.0.0.1
  port: 20001
  shutdown: graceful
  error: {include-message: never, include-stacktrace: never}
spring:
  codec: {max-in-memory-size: 11MB}
  application: {name: haifa-personal-assistant}
  lifecycle: {timeout-per-shutdown-phase: 20s}
logging:
  level: {io.haifa.agent.personalassistant.server.observability: INFO}
management:
  endpoints: {web: {exposure: {include: health}}}
  endpoint: {health: {probes: {enabled: true}, show-details: never}}
haifa:
  personal:
    data-directory: ${HAIFA_PERSONAL_DATA_DIR:./data/personal-assistant}
    continuation-key-base64: ${HAIFA_PERSONAL_CONTINUATION_KEY:}
    caller:
      tenant: ${HAIFA_PERSONAL_TENANT:local}
      principal: ${HAIFA_PERSONAL_PRINCIPAL:public-user}
      reviewer: ${HAIFA_PERSONAL_REVIEWER:public-user}
    model-providers:
      - {id: deepseek, mode: remote, native-streaming: true, endpoint: https://api.deepseek.com, credential-reference: env://DEEPSEEK_API_KEY, allowed-bindings: [deepseek-chat-pro, deepseek-chat-flash, deepseek-responses-flash, deepseek-responses-pro, deepseek-anthropic-flash, deepseek-anthropic-pro, deepseek-v4-flash-vision-exp, deepseek-responses-v4-flash-vision-exp, deepseek-anthropic-v4-flash-vision-exp], binding-endpoint-overrides: {deepseek-anthropic-flash: https://api.deepseek.com/anthropic, deepseek-anthropic-pro: https://api.deepseek.com/anthropic, deepseek-anthropic-v4-flash-vision-exp: https://api.deepseek.com/anthropic}}
      - {id: openai-codex, mode: remote, native-streaming: true, endpoint: https://chatgpt.com/backend-api/codex, credential-reference: model-auth://openai-codex/default, allowed-bindings: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]}
      - {id: aliyun-bailian, mode: remote, native-streaming: true, endpoint: "${HAIFA_PERSONAL_BAILIAN_ENDPOINT:https://${ALIYUN_BAILIAN_WORKSPACE_ID:${HAIFA_BAILIAN_WORKSPACE_ID:default-workspace}}.${ALIYUN_BAILIAN_REGION:${HAIFA_BAILIAN_REGION:cn-beijing}}.maas.aliyuncs.com/compatible-mode/v1}", credential-reference: env://DASHSCOPE_API_KEY, default-reasoning-mode: ENABLED, allowed-bindings: [qwen3.8-max-0902, qwen3.8-max, qwen3.8-flash, qwen3.7-plus, qwen3-vl-plus]}
      - {id: siliconflow, mode: remote, native-streaming: true, endpoint: https://api.siliconflow.cn/v1, credential-reference: env://SILICONFLOW_API_KEY, default-reasoning-mode: ENABLED, allowed-bindings: [siliconflow-deepseek-v4-pro, siliconflow-deepseek-v4-flash, siliconflow-qwen3-vl-32b, siliconflow-qwen3-32b, siliconflow-kimi-k3, siliconflow-kimi-k2-6, siliconflow-glm-5-2, siliconflow-glm-5-1]}
      - {id: kimi, mode: remote, native-streaming: true, endpoint: https://api.moonshot.cn/v1, credential-reference: env://KIMI_API_KEY, default-reasoning-mode: ENABLED, allowed-bindings: [kimi-k3, kimi-k2.7-code, kimi-k2.6]}
      - {id: zhipu, mode: remote, native-streaming: true, endpoint: https://open.bigmodel.cn/api/paas/v4, credential-reference: env://BIGMODEL_API_KEY, default-reasoning-mode: ENABLED, allowed-bindings: [glm-5.2, glm-5.1, glm-5, glm-5-turbo]}
    default-model-id: ${HAIFA_PERSONAL_DEFAULT_MODEL_ID:deepseek-chat-flash}
    allow-insecure-loopback-model: ${HAIFA_PERSONAL_ALLOW_INSECURE_LOOPBACK_MODEL:true}
    web:
      search: {enabled: false, provider-id: tavily, endpoint: https://api.tavily.com/search, credential-reference: env://TAVILY_API_KEY, timeout-millis: 30000, maximum-response-bytes: 2097152}
      fetch: {enabled: false, provider-id: tavily, endpoint: https://api.tavily.com/extract, credential-reference: env://TAVILY_API_KEY, timeout-millis: 30000, maximum-response-bytes: 262144}
    mission: {planner-mode: runtime, max-tasks: 8, max-dependency-depth: 4, max-acceptance-criteria: 20, global-active-task-runs: 1, max-auto-attempts-per-task: 1, max-wall-clock-millis: 7200000, max-model-tokens: 3000000, max-tool-calls: 360, max-artifacts: 8, max-total-artifact-bytes: 4194304, dispatcher-poll-millis: 500, dispatcher-shutdown-timeout-millis: 20000, recovery-batch-size: 100, db-warning-bytes: 536870912, db-stop-bytes: 1073741824, artifact-warning-bytes: 1073741824, artifact-stop-bytes: 2147483648}
    research: {max-sources: 24, max-source-content-bytes: 262144, max-total-content-bytes: 2097152}
    mcp: {mode: embedded-echo, address: 127.0.0.1, port: 20002, endpoint: http://127.0.0.1:20002/mcp, allowed-tools: [echo], alias-namespace: personal_mcp, server-id: personal-local, display-name: Personal local utility}
    execution: {default-timeout-millis: 15000, maximum-timeout-millis: 30000, maximum-output-bytes: 65536, maximum-output-lines: 1000, maximum-processes: 4, trusted-host-enabled: false, python-path: '', power-shell-path: ''}
    local-skill-root: ''
    trusted-script-manifest: ''
