server:
  address: 127.0.0.1
  port: 20001
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  codec:
    max-in-memory-size: 11MB
  application:
    name: haifa-personal-assistant
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  level:
    io.haifa.agent.personalassistant.server.observability: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{48} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: personalAssistant,personalMission

haifa:
  personal:
    data-directory: ${HAIFA_PERSONAL_DATA_DIR:./data/personal-assistant}
    continuation-key-base64: ${HAIFA_PERSONAL_CONTINUATION_KEY:}
    caller:
      tenant: ${HAIFA_PERSONAL_TENANT:local}
      principal: ${HAIFA_PERSONAL_PRINCIPAL:public-user}
      reviewer: ${HAIFA_PERSONAL_REVIEWER:public-user}
    model-providers:
      - id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_ID:deepseek}
        display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_DISPLAYNAME:DeepSeek}
        mode: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODE:remote}
        allow-deterministic: ${HAIFA_PERSONAL_MODELPROVIDERS_0_ALLOWDETERMINISTIC:false}
        native-streaming: ${HAIFA_PERSONAL_MODELPROVIDERS_0_NATIVESTREAMING:true}
        endpoint: ${HAIFA_PERSONAL_MODELPROVIDERS_0_ENDPOINT:https://api.deepseek.com}
        credential-reference: ${HAIFA_PERSONAL_MODELPROVIDERS_0_CREDENTIALREFERENCE:env://DEEPSEEK_API_KEY}
        api-bindings:
          - style: openai-chat-completions
            dialect: deepseek-openai-chat
          - style: openai-responses
            dialect: deepseek-openai-responses
          - style: anthropic-messages
            dialect: deepseek-anthropic-messages
            endpoint: https://api.deepseek.com/anthropic
        models:
          - id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_0_ID:deepseek-chat-pro}
            display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_0_DISPLAYNAME:DeepSeek V4 Pro · Chat Completions}
            model-display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_0_MODELDISPLAYNAME:DeepSeek V4 Pro}
            provider-model-id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_0_PROVIDERMODELID:deepseek-v4-pro}
            style: openai-chat-completions
            capabilities: [TEXT_CHAT, TOOL_CALLING, STRUCTURED_OUTPUT, REASONING]
            context-window: 1048576
            max-output-tokens: 393216
          - id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_1_ID:deepseek-chat-flash}
            display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_1_DISPLAYNAME:DeepSeek V4 Flash · Chat Completions}
            model-display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_1_MODELDISPLAYNAME:DeepSeek V4 Flash}
            provider-model-id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_1_PROVIDERMODELID:deepseek-v4-flash}
            style: openai-chat-completions
            capabilities: [TEXT_CHAT, TOOL_CALLING, STRUCTURED_OUTPUT, REASONING]
            context-window: 1048576
            max-output-tokens: 393216
          - id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_2_ID:deepseek-responses-flash}
            display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_2_DISPLAYNAME:DeepSeek V4 Flash · Responses}
            model-display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_2_MODELDISPLAYNAME:DeepSeek V4 Flash}
            provider-model-id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_2_PROVIDERMODELID:deepseek-v4-flash}
            style: openai-responses
            capabilities: [TEXT_CHAT, TOOL_CALLING, STRUCTURED_OUTPUT, REASONING]
            context-window: 1048576
            max-output-tokens: 393216
          - id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_3_ID:deepseek-anthropic-flash}
            display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_3_DISPLAYNAME:DeepSeek V4 Flash · Anthropic Messages}
            model-display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_3_MODELDISPLAYNAME:DeepSeek V4 Flash}
            provider-model-id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_3_PROVIDERMODELID:deepseek-v4-flash}
            style: anthropic-messages
            capabilities: [TEXT_CHAT, TOOL_CALLING, REASONING]
            context-window: 1048576
            max-output-tokens: 393216
          - id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_4_ID:deepseek-responses-pro}
            display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_4_DISPLAYNAME:DeepSeek V4 Pro · Responses}
            model-display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_4_MODELDISPLAYNAME:DeepSeek V4 Pro}
            provider-model-id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_4_PROVIDERMODELID:deepseek-v4-pro}
            style: openai-responses
            capabilities: [TEXT_CHAT, TOOL_CALLING, STRUCTURED_OUTPUT, REASONING]
            context-window: 1048576
            max-output-tokens: 393216
          - id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_5_ID:deepseek-anthropic-pro}
            display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_5_DISPLAYNAME:DeepSeek V4 Pro · Anthropic Messages}
            model-display-name: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_5_MODELDISPLAYNAME:DeepSeek V4 Pro}
            provider-model-id: ${HAIFA_PERSONAL_MODELPROVIDERS_0_MODELS_5_PROVIDERMODELID:deepseek-v4-pro}
            style: anthropic-messages
            capabilities: [TEXT_CHAT, TOOL_CALLING, REASONING]
            context-window: 1048576
            max-output-tokens: 393216
    default-model-id: ${HAIFA_PERSONAL_DEFAULT_MODEL_ID:deepseek-chat-flash}
    allow-insecure-loopback-model: ${HAIFA_PERSONAL_ALLOW_INSECURE_LOOPBACK_MODEL:true}
    web:
      enabled: ${HAIFA_PERSONAL_WEB_ENABLED:false}
      credential-reference: ${HAIFA_PERSONAL_WEB_CREDENTIAL:env://ALIYUN_IQS_API_KEY}
      timeout-millis: ${HAIFA_PERSONAL_WEB_TIMEOUT_MILLIS:30000}
      search-maximum-response-bytes: ${HAIFA_PERSONAL_WEB_SEARCH_MAXIMUM_RESPONSE_BYTES:2097152}
      fetch-maximum-response-bytes: ${HAIFA_PERSONAL_WEB_FETCH_MAXIMUM_RESPONSE_BYTES:262144}
    mission:
      planner-mode: ${HAIFA_PERSONAL_MISSION_PLANNER_MODE:runtime}
      max-tasks: ${HAIFA_PERSONAL_MISSION_MAX_TASKS:8}
      max-dependency-depth: ${HAIFA_PERSONAL_MISSION_MAX_DEPENDENCY_DEPTH:4}
      max-acceptance-criteria: ${HAIFA_PERSONAL_MISSION_MAX_ACCEPTANCE_CRITERIA:20}
      global-active-task-runs: ${HAIFA_PERSONAL_MISSION_GLOBAL_ACTIVE_TASK_RUNS:1}
      max-auto-attempts-per-task: ${HAIFA_PERSONAL_MISSION_MAX_AUTO_ATTEMPTS_PER_TASK:1}
      max-wall-clock-millis: ${HAIFA_PERSONAL_MISSION_MAX_WALL_CLOCK_MILLIS:7200000}
      max-model-tokens: ${HAIFA_PERSONAL_MISSION_MAX_MODEL_TOKENS:3000000}
      max-tool-calls: ${HAIFA_PERSONAL_MISSION_MAX_TOOL_CALLS:360}
      max-artifacts: ${HAIFA_PERSONAL_MISSION_MAX_ARTIFACTS:8}
      max-total-artifact-bytes: ${HAIFA_PERSONAL_MISSION_MAX_TOTAL_ARTIFACT_BYTES:4194304}
      dispatcher-poll-millis: ${HAIFA_PERSONAL_MISSION_DISPATCHER_POLL_MILLIS:500}
      dispatcher-shutdown-timeout-millis: ${HAIFA_PERSONAL_MISSION_DISPATCHER_SHUTDOWN_TIMEOUT_MILLIS:20000}
      recovery-batch-size: ${HAIFA_PERSONAL_MISSION_RECOVERY_BATCH_SIZE:100}
      db-warning-bytes: ${HAIFA_PERSONAL_MISSION_DB_WARNING_BYTES:536870912}
      db-stop-bytes: ${HAIFA_PERSONAL_MISSION_DB_STOP_BYTES:1073741824}
      artifact-warning-bytes: ${HAIFA_PERSONAL_MISSION_ARTIFACT_WARNING_BYTES:1073741824}
      artifact-stop-bytes: ${HAIFA_PERSONAL_MISSION_ARTIFACT_STOP_BYTES:2147483648}
    research:
      max-sources: ${HAIFA_PERSONAL_RESEARCH_MAX_SOURCES:24}
      max-source-content-bytes: ${HAIFA_PERSONAL_RESEARCH_MAX_SOURCE_CONTENT_BYTES:262144}
      max-total-content-bytes: ${HAIFA_PERSONAL_RESEARCH_MAX_TOTAL_CONTENT_BYTES:2097152}
    mcp:
      mode: ${HAIFA_PERSONAL_MCP_MODE:embedded-echo}
      address: 127.0.0.1
      port: ${HAIFA_PERSONAL_MCP_PORT:20002}
      endpoint: ${HAIFA_PERSONAL_MCP_ENDPOINT:http://127.0.0.1:20002/mcp}
      allowed-tools: ${HAIFA_PERSONAL_MCP_ALLOWED_TOOLS:echo}
      alias-namespace: ${HAIFA_PERSONAL_MCP_ALIAS_NAMESPACE:personal_mcp}
      server-id: ${HAIFA_PERSONAL_MCP_SERVER_ID:personal-local}
      display-name: ${HAIFA_PERSONAL_MCP_DISPLAY_NAME:Personal local utility}
    execution:
      default-timeout-millis: ${HAIFA_PERSONAL_EXECUTION_DEFAULT_TIMEOUT_MILLIS:15000}
      maximum-timeout-millis: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_TIMEOUT_MILLIS:30000}
      maximum-output-bytes: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_OUTPUT_BYTES:65536}
      maximum-output-lines: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_OUTPUT_LINES:1000}
      maximum-processes: ${HAIFA_PERSONAL_EXECUTION_MAXIMUM_PROCESSES:4}
      trusted-host-enabled: ${HAIFA_PERSONAL_EXECUTION_TRUSTED_HOST_ENABLED:false}
      python-path: ${HAIFA_PERSONAL_PYTHON_PATH:}
      power-shell-path: ${HAIFA_PERSONAL_POWERSHELL_PATH:}
    local-skill-root: ${HAIFA_PERSONAL_SKILL_ROOT:}
    trusted-script-manifest: ${HAIFA_PERSONAL_TRUSTED_SCRIPT_MANIFEST:}
