plugins {
    id "java"
}

group = "io.haifa.smoke"
version = "1.0.0"

repositories {
    if (project.hasProperty("haifaRepository")) {
        exclusiveContent {
            forRepository { maven { url = uri(project.property("haifaRepository")) } }
            filter { includeGroup("io.haifa") }
        }
    } else {
        mavenLocal()
    }
    mavenCentral()
}

dependencies {
    implementation platform("io.haifa:haifa-agent-bom:${findProperty('haifaVersion') ?: '0.1.3'}")
    implementation "io.haifa:haifa-agent-sdk-starter"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
