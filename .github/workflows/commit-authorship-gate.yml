name: Commit Authorship Gate

on:
    pull_request:
        branches: [dev, main]
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: commit-authorship-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
    cancel-in-progress: true

jobs:
    authorship:
        name: Commit authorship gate
        if: >-
            github.event_name != 'merge_group' ||
            github.event.merge_group.base_ref == 'refs/heads/dev' ||
            github.event.merge_group.base_ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Resolve commit range
              id: range
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
                  MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
                  MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
              run: |
                  set -euo pipefail
                  if [ "$EVENT_NAME" = "pull_request" ]; then
                      base="$PR_BASE_SHA"
                      base_ref="$PR_BASE_REF"
                      head="$PR_HEAD_SHA"
                  elif [ "$EVENT_NAME" = "merge_group" ]; then
                      base="$MERGE_GROUP_BASE_SHA"
                      base_ref="${MERGE_GROUP_BASE_REF#refs/heads/}"
                      head="$MERGE_GROUP_HEAD_SHA"
                  else
                      base=""
                      base_ref="dev"
                      head="HEAD"
                  fi
                  if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
                      base=$(git merge-base "origin/$base_ref" "$head" || true)
                  fi
                  if [ -z "$base" ]; then
                      echo "::error::cannot resolve a base commit for the commit authorship gate"
                      exit 1
                  fi
                  printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
                  printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"
            - name: Reject forbidden commit identities
              env:
                  BASE: ${{ steps.range.outputs.base }}
                  HEAD_REVISION: ${{ steps.range.outputs.head }}
              run: python3 build-support/scripts/check_commit_authors.py --range "${BASE}..${HEAD_REVISION}"
