name: Main Release Gate

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
        tags: ["v*"]
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: main-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-unit:
        name: Release unit gate
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Require dev as source for main PR
              if: github.event_name == 'pull_request' && github.head_ref != 'dev'
              run: |
                  echo "Only dev may open PRs into main."
                  exit 1
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Fast release verification
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 2 -Pci-fast clean verify

    release-integration:
        name: Release integration gate
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'
        needs: release-unit
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Integration verification without unit rerun
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 2 -Pci-integration-only verify

    release-artifacts:
        name: Release artifact gate
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'
        needs: release-unit
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: "8.14"
            - name: Build SDK and CLI release artifacts without test rerun
              run: |
                  sh ./mvnw --batch-mode --no-transfer-progress -T 2 \
                    -pl ':haifa-agent-bom,:haifa-agent-spring-bom,:haifa-agent-sdk,:haifa-agent-sdk-starter,:haifa-agent-spring-boot-autoconfigure,:haifa-agent-spring-boot-starter,:haifa-agent-cli' \
                    -am -Prelease-artifacts install
            - name: External Maven, Gradle, and Spring consumer smoke
              run: bash build-support/sdk-consumer-smoke/verify.sh
            - name: Standalone Java and Spring example applications
              run: examples/haifa-agent-example/mvnw -f examples/haifa-agent-example/pom.xml clean verify
            - name: CLI entrypoint smoke
              run: java -jar haifa-agent-applications/haifa-agent-cli/target/haifa-agent-cli-0.1.0.jar --help

    release-gate:
        name: Release gate
        if: >-
            always() &&
            (github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main')
        needs:
            - release-unit
            - release-integration
            - release-artifacts
        runs-on: ubuntu-latest
        steps:
            - name: Require every same-SHA release gate to pass
              env:
                  UNIT_RESULT: ${{ needs.release-unit.result }}
                  INTEGRATION_RESULT: ${{ needs.release-integration.result }}
                  ARTIFACT_RESULT: ${{ needs.release-artifacts.result }}
              run: |
                  test "$UNIT_RESULT" = success
                  test "$UNIT_RESULT" = success
                  test "$INTEGRATION_RESULT" = success
                  test "$ARTIFACT_RESULT" = success

    release-windows-packages:
        name: Release Windows packages
        needs: release-gate
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        runs-on: windows-latest
        timeout-minutes: 60
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: haifa-agent-applications/haifa-agent-personal-assistant-web/package-lock.json
            - name: Build CLI, Personal Assistant, and SDK artifacts
              run: |
                  .\mvnw.cmd --batch-mode --no-transfer-progress -T 2 `
                    -pl ':haifa-agent-bom,:haifa-agent-spring-bom,:haifa-agent-sdk,:haifa-agent-sdk-starter,:haifa-agent-spring-boot-autoconfigure,:haifa-agent-spring-boot-starter,:haifa-agent-cli,:haifa-agent-personal-assistant-server' `
                    -am -Prelease-artifacts install
            - name: Install Personal Assistant Web dependencies
              working-directory: haifa-agent-applications/haifa-agent-personal-assistant-web
              run: npm ci
            - name: Package Windows distributions
              shell: pwsh
              run: |
                  $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { $null }
                  if ($version) {
                    python dist-support/scripts/package_distributions.py all --version $version
                  } else {
                    python dist-support/scripts/package_distributions.py all
                  }
            - name: Upload Windows packages
              uses: actions/upload-artifact@v4
              with:
                  name: haifa-windows-packages-${{ github.sha }}
                  path: |
                      dist-support/output/*.zip
                      dist-support/output/sha256sums.txt
                  if-no-files-found: error
            - name: Publish packages to the GitHub Release
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF_NAME}"
                  if ! gh release view "$tag" >/dev/null 2>&1; then
                    gh release create "$tag" --title "Haifa Agent $tag" --generate-notes --verify-tag
                  fi
                  gh release upload "$tag" dist-support/output/*.zip dist-support/output/sha256sums.txt --clobber
