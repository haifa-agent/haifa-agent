name: Main Release Gate

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
        tags: ["v*"]
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: main-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    suite-governance-plan:
        name: Release Suite plan (${{ matrix.combination }})
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      combination: linux-deepseek
                    - os: macos-latest
                      combination: macos-deepseek
                    - os: windows-latest
                      combination: windows-deepseek
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        env:
            HAIFA_TEST_MATRIX_COMBINATION: ${{ matrix.combination }}
        steps:
            - uses: actions/checkout@v4
            - name: Require private test-config deploy key
              shell: bash
              env:
                  TEST_CONFIG_SSH_KEY: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
              run: test -n "$TEST_CONFIG_SSH_KEY"
            - uses: actions/checkout@v4
              with:
                  repository: haifa-agent/haifa-agent-test-config
                  ssh-key: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
                  path: test-config
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Prepare external run root (Unix)
              if: runner.os != 'Windows'
              run: |
                  mkdir -p "$RUNNER_TEMP/haifa-test-runs"
                  echo "HAIFA_TEST_RUN_ROOT=$RUNNER_TEMP/haifa-test-runs" >> "$GITHUB_ENV"
            - name: Prepare external run root (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $runRoot = Join-Path $env:RUNNER_TEMP 'haifa-test-runs'
                  New-Item -ItemType Directory -Force -Path $runRoot | Out-Null
                  "HAIFA_TEST_RUN_ROOT=$runRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            - name: Plan Release Suite (Unix)
              if: runner.os != 'Windows'
              run: bash test-config/scripts/run-suite.sh release-v1
            - name: Plan Release Suite (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: .\test-config\scripts\run-suite.ps1 release-v1

    release-unit:
        name: Release unit gate
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'
        needs: suite-governance-plan
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Require dev as source for main PR
              if: github.event_name == 'pull_request' && github.head_ref != 'dev'
              run: |
                  echo "Only dev may open PRs into main."
                  exit 1
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Fast release verification
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 4 -Pci-fast clean verify

    release-integration:
        name: Release integration gate
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'
        needs: release-unit
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Integration verification without unit rerun
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 4 -Pci-integration-only verify

    release-artifacts:
        name: Release artifact gate
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'
        needs: release-unit
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: "8.14"
            - name: Build SDK and CLI release artifacts without test rerun
              run: |
                  sh ./mvnw --batch-mode --no-transfer-progress -T 4 \
                    -pl ':haifa-agent-bom,:haifa-agent-spring-bom,:haifa-agent-sdk,:haifa-agent-sdk-starter,:haifa-agent-spring-boot-autoconfigure,:haifa-agent-spring-boot-starter,:haifa-agent-cli' \
                    -am -Prelease-artifacts install
            - name: External Maven, Gradle, and Spring consumer smoke
              run: bash build-support/sdk-consumer-smoke/verify.sh
            - name: Standalone Java and Spring example applications
              run: examples/haifa-agent-example/mvnw -f examples/haifa-agent-example/pom.xml clean verify
            - name: CLI entrypoint smoke
              run: java -jar haifa-agent-applications/haifa-agent-cli/target/haifa-agent-cli-0.1.0-SNAPSHOT.jar --help

    release-gate:
        name: Release gate
        if: >-
            always() &&
            (github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main')
        needs:
            - suite-governance-plan
            - release-unit
            - release-integration
            - release-artifacts
        runs-on: ubuntu-latest
        steps:
            - name: Require every same-SHA release gate to pass
              env:
                  SUITE_RESULT: ${{ needs.suite-governance-plan.result }}
                  UNIT_RESULT: ${{ needs.release-unit.result }}
                  INTEGRATION_RESULT: ${{ needs.release-integration.result }}
                  ARTIFACT_RESULT: ${{ needs.release-artifacts.result }}
              run: |
                  test "$SUITE_RESULT" = success
                  test "$UNIT_RESULT" = success
                  test "$INTEGRATION_RESULT" = success
                  test "$ARTIFACT_RESULT" = success
