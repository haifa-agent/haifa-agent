name: Main Release Gate

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
        tags: ["v*"]
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: main-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-unit:
        name: Release unit gate
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Require dev as source for main PR
              if: github.event_name == 'pull_request' && github.head_ref != 'dev'
              run: |
                  echo "Only dev may open PRs into main."
                  exit 1
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: SDK packaging contracts
              run: python3 -m unittest scripts.tests.test_release_distributions scripts.tests.test_release_assets
            - name: Fast release verification
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 2 -Pci-fast clean verify

    release-integration:
        name: Release integration gate
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'
        needs: release-unit
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Slow release verification
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 2 -Pslow-tests test
            - name: Integration verification without unit rerun
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 2 -Pci-integration-only verify

    release-artifacts:
        name: Release artifact gate
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'
        needs: release-unit
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: "8.14"
            - name: Build SDK and CLI release artifacts without test rerun
              run: |
                  sdk_modules=$(python3 dist-support/scripts/package_distributions.py sdk-modules)
                  sh ./mvnw --batch-mode --no-transfer-progress -T 2 \
                    -pl "${sdk_modules},:haifa-agent-cli" -am -Prelease-artifacts verify
            - name: Package and unpack the SDK repository
              run: |
                  python3 dist-support/scripts/package_distributions.py sdk
                  python3 -m zipfile -e dist-support/output/haifa-agent-sdk-*.zip dist-support/sdk-smoke
            - name: External Maven, Gradle, and Spring consumer smoke
              run: |
                  version=$(sed -n 's/.*<revision>\(.*\)<\/revision>.*/\1/p' pom.xml | head -n1)
                  python3 build-support/sdk-consumer-smoke/verify.py \
                    --repository "dist-support/sdk-smoke/haifa-agent-sdk-v${version}/repository" --version "$version"
            - name: CLI entrypoint smoke
              run: |
                  version=$(sed -n 's/.*<revision>\(.*\)<\/revision>.*/\1/p' pom.xml | head -n1)
                  java -jar "haifa-agent-applications/haifa-agent-cli/target/haifa-agent-cli-${version}.jar" --help
            - name: Upload the SDK package for the release job
              if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: haifa-sdk-package-${{ github.sha }}
                  path: |
                      dist-support/output/haifa-agent-sdk-*.zip
                      dist-support/output/sha256sums.txt
                  if-no-files-found: error
            - name: Package and verify Linux Coding Agent
              if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
              shell: bash
              run: |
                  args=()
                  if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                    args=(--version "${GITHUB_REF_NAME#v}")
                  fi
                  python3 dist-support/scripts/package_distributions.py ca:linux-x64 --output-dir dist-support/linux-ca "${args[@]}"
                  python3 dist-support/scripts/smoke_distributions.py verify-ca-linux --output-dir dist-support/linux-ca
                  python3 dist-support/scripts/smoke_coding_install.py --output-dir dist-support/linux-ca
            - name: Upload the Linux Coding Agent package
              if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: haifa-linux-ca-package-${{ github.sha }}
                  path: |
                      dist-support/linux-ca/*.tar.gz
                      dist-support/linux-ca/install-haifa.sh
                      dist-support/linux-ca/sha256sums.txt
                  if-no-files-found: error

    release-gate:
        name: Release gate
        if: >-
            always() &&
            (github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main')
        needs:
            - release-unit
            - release-integration
            - release-artifacts
        runs-on: ubuntu-latest
        steps:
            - name: Require every same-SHA release gate to pass
              env:
                  UNIT_RESULT: ${{ needs.release-unit.result }}
                  INTEGRATION_RESULT: ${{ needs.release-integration.result }}
                  ARTIFACT_RESULT: ${{ needs.release-artifacts.result }}
              run: |
                  test "$UNIT_RESULT" = success
                  test "$UNIT_RESULT" = success
                  test "$INTEGRATION_RESULT" = success
                  test "$ARTIFACT_RESULT" = success

    release-windows-packages:
        name: Release Windows packages
        needs: release-gate
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        runs-on: windows-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: haifa-agent-applications/haifa-agent-personal-assistant-web/package-lock.json
            - name: Build CLI and Personal Assistant artifacts
              run: |
                  .\mvnw.cmd --batch-mode --no-transfer-progress -T 2 `
                    -pl ":haifa-agent-cli,:haifa-agent-personal-assistant-server" `
                    -am -Prelease-artifacts verify
            - name: Install Personal Assistant Web dependencies
              working-directory: haifa-agent-applications/haifa-agent-personal-assistant-web
              run: npm ci
            - name: Package the Windows-host targets and the platform-neutral server package
              shell: pwsh
              run: |
                  $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { $null }
                  if ($version) {
                    python dist-support/scripts/package_distributions.py ca pa pa:linux-x64 --version $version
                  } else {
                    python dist-support/scripts/package_distributions.py ca pa pa:linux-x64
                  }
            - name: Verify extracted Windows distributions
              run: python dist-support/scripts/smoke_distributions.py verify
            - name: Verify clean Windows Coding Agent install
              run: python dist-support/scripts/smoke_coding_install.py
            - name: Upload Windows packages
              uses: actions/upload-artifact@v4
              with:
                  name: haifa-windows-packages-${{ github.sha }}
                  path: |
                      dist-support/output/*.zip
                      dist-support/output/install-haifa.ps1
                      dist-support/output/sha256sums.txt
                  if-no-files-found: error

    publish-release:
        name: Publish all release packages
        needs: [release-artifacts, release-windows-packages]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: haifa-sdk-package-${{ github.sha }}
                  path: packages/sdk
            - uses: actions/download-artifact@v4
              with:
                  name: haifa-linux-ca-package-${{ github.sha }}
                  path: packages/linux
            - uses: actions/download-artifact@v4
              with:
                  name: haifa-windows-packages-${{ github.sha }}
                  path: packages/windows
            - name: Assemble and verify the release set
              shell: bash
              run: |
                  set -euo pipefail
                  tag="v$(python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "dist-support/scripts"); from distribution_contracts import read_pom_version; print(read_pom_version(Path("pom.xml")))')"
                  if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test "$tag" = "$GITHUB_REF_NAME"; fi
                  python3 dist-support/scripts/release_assets.py assemble "$tag" packages release
            - name: Publish the complete, verified GitHub Release
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF_NAME}"
                  prerelease=false
                  if [[ "$tag" == *-* ]]; then prerelease=true; fi
                  if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
                    if [[ "$draft" != true ]]; then
                      echo "Release $tag is already published."
                      exit 1
                    fi
                  else
                    gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Haifa Agent $tag" \
                      --generate-notes --verify-tag --draft --prerelease="$prerelease"
                  fi
                  gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release/*
                  gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > draft-assets.json
                  python3 dist-support/scripts/release_assets.py verify-draft release draft-assets.json
                  gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease"
