name: Dev Integration

on:
    push:
        branches: [dev]
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dev-integration-${{ github.ref }}
    cancel-in-progress: true

jobs:
    suite-governance-plan:
        name: Suite governance plan (${{ matrix.os }})
        if: >-
            github.event_name != 'workflow_dispatch' &&
            (github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/dev')
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      combination: linux-deepseek-primary
                    - os: windows-latest
                      combination: windows-deepseek-primary
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        env:
            HAIFA_TEST_MATRIX_COMBINATION: ${{ matrix.combination }}
        steps:
            - uses: actions/checkout@v4
            - name: Require private test-config deploy key
              shell: bash
              env:
                  TEST_CONFIG_SSH_KEY: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
              run: test -n "$TEST_CONFIG_SSH_KEY"
            - uses: actions/checkout@v4
              with:
                  repository: haifa-agent/haifa-agent-test-config
                  ssh-key: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
                  path: test-config
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Prepare external run root (Unix)
              if: runner.os != 'Windows'
              run: |
                  mkdir -p "$RUNNER_TEMP/haifa-test-runs"
                  echo "HAIFA_TEST_RUN_ROOT=$RUNNER_TEMP/haifa-test-runs" >> "$GITHUB_ENV"
            - name: Prepare external run root (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $runRoot = Join-Path $env:RUNNER_TEMP 'haifa-test-runs'
                  New-Item -ItemType Directory -Force -Path $runRoot | Out-Null
                  "HAIFA_TEST_RUN_ROOT=$runRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            - name: Plan Nightly Suite (Unix)
              if: runner.os != 'Windows'
              run: bash test-config/scripts/run-suite.sh nightly-v1
            - name: Plan Nightly Suite (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: .\test-config\scripts\run-suite.ps1 nightly-v1

    remote-suite-governance-plan:
        name: Remote plan (${{ matrix.suite }}, ${{ matrix.combination }}, ${{ matrix.os }})
        if: github.event_name == 'workflow_dispatch'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: nightly-v1
                      os: ubuntu-latest
                      combination: linux-deepseek-primary
                    - suite: nightly-v1
                      os: windows-latest
                      combination: windows-deepseek-primary
                    - suite: release-v1
                      os: ubuntu-latest
                      combination: linux-deepseek
                    - suite: release-v1
                      os: windows-latest
                      combination: windows-deepseek
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        env:
            HAIFA_TEST_MATRIX_COMBINATION: ${{ matrix.combination }}
        steps:
            - uses: actions/checkout@v4
            - name: Require private test-config deploy key
              shell: bash
              env:
                  TEST_CONFIG_SSH_KEY: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
              run: test -n "$TEST_CONFIG_SSH_KEY"
            - uses: actions/checkout@v4
              with:
                  repository: haifa-agent/haifa-agent-test-config
                  ssh-key: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
                  path: test-config
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Prepare external run root (Unix)
              if: runner.os != 'Windows'
              run: |
                  mkdir -p "$RUNNER_TEMP/haifa-test-runs"
                  echo "HAIFA_TEST_RUN_ROOT=$RUNNER_TEMP/haifa-test-runs" >> "$GITHUB_ENV"
            - name: Prepare external run root (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $runRoot = Join-Path $env:RUNNER_TEMP 'haifa-test-runs'
                  New-Item -ItemType Directory -Force -Path $runRoot | Out-Null
                  "HAIFA_TEST_RUN_ROOT=$runRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            - name: Plan Suite (Unix)
              if: runner.os != 'Windows'
              run: bash test-config/scripts/run-suite.sh ${{ matrix.suite }}
            - name: Plan Suite (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: .\test-config\scripts\run-suite.ps1 ${{ matrix.suite }}

    fast-cross-platform:
        name: Fast verify (${{ matrix.os }})
        if: >-
            github.event_name != 'workflow_dispatch' &&
            (github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/dev')
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Verify architecture and tests (Unix)
              if: runner.os != 'Windows'
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 1C -Pci-fast clean verify
            - name: Verify architecture and tests (Windows)
              if: runner.os == 'Windows'
              run: .\mvnw.cmd --batch-mode --no-transfer-progress -T 1C -Pci-fast clean verify

    integration:
        name: Integration verify
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        needs: fast-cross-platform
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Run Failsafe integration route
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 1C -Pci-integration -DskipITs=false verify

    local-native-isolation-linux:
        name: Local Native isolation (linux)
        runs-on: ubuntu-latest
        needs: fast-cross-platform
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Install and record bubblewrap
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes bubblewrap
                  bwrap --version
            - name: Run Linux Local Native isolation IT
              run: >-
                  sh ./mvnw --batch-mode --no-transfer-progress
                  -pl :haifa-agent-sandbox-local-native -am
                  -Pci-integration -DskipITs=false
                  -Dit.test=LinuxBubblewrapSandboxIT
                  -Dfailsafe.failIfNoSpecifiedTests=false verify

    local-native-isolation-macos:
        name: Local Native isolation (macos)
        runs-on: macos-latest
        needs: fast-cross-platform
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Record Seatbelt capability
              run: |
                  sw_vers
                  test -x /usr/bin/sandbox-exec
            - name: Run macOS Local Native isolation IT
              run: >-
                  sh ./mvnw --batch-mode --no-transfer-progress
                  -pl :haifa-agent-sandbox-local-native -am
                  -Pci-integration -DskipITs=false
                  -Dit.test=MacSeatbeltSandboxIT
                  -Dfailsafe.failIfNoSpecifiedTests=false verify

    local-native-unsupported-windows:
        name: Local Native unsupported (windows)
        runs-on: windows-latest
        needs: fast-cross-platform
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Run Windows unsupported IT
              run: >-
                  .\mvnw.cmd --batch-mode --no-transfer-progress
                  -pl :haifa-agent-sandbox-local-native -am
                  -Pci-integration "-DskipITs=false"
                  "-Dit.test=LocalNativeWindowsIT"
                  "-Dfailsafe.failIfNoSpecifiedTests=false" verify
