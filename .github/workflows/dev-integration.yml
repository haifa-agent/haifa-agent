name: Dev Integration

on:
    push:
        branches: [dev]
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dev-integration-${{ github.ref }}
    cancel-in-progress: true

jobs:
    suite-governance-plan:
        name: Suite governance plan (${{ matrix.os }})
        if: >-
            github.event_name != 'workflow_dispatch' &&
            (github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/dev')
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      combination: linux-primary
                    - os: windows-latest
                      combination: windows-primary
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        env:
            HAIFA_TEST_MATRIX_COMBINATION: ${{ matrix.combination }}
            HAIFA_TEST_AGENT_PROFILE: coding-bailian-qwen37-flash-2026-07-15
        steps:
            - uses: actions/checkout@v4
            - name: Require private test-config deploy key
              shell: bash
              env:
                  TEST_CONFIG_SSH_KEY: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
              run: test -n "$TEST_CONFIG_SSH_KEY"
            - uses: actions/checkout@v4
              with:
                  repository: haifa-agent/haifa-agent-test-config
                  ssh-key: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
                  path: test-config
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Prepare external run root (Unix)
              if: runner.os != 'Windows'
              run: |
                  mkdir -p "$RUNNER_TEMP/haifa-test-runs"
                  echo "HAIFA_TEST_RUN_ROOT=$RUNNER_TEMP/haifa-test-runs" >> "$GITHUB_ENV"
            - name: Prepare external run root (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $runRoot = Join-Path $env:RUNNER_TEMP 'haifa-test-runs'
                  New-Item -ItemType Directory -Force -Path $runRoot | Out-Null
                  "HAIFA_TEST_RUN_ROOT=$runRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            - name: Plan Critical Path regression suite (Unix)
              if: runner.os != 'Windows'
              run: >-
                  bash test-config/scripts/run-suite.sh plan
                  --suite critical-path-regression-v1
                  --mode live
                  --output "$RUNNER_TEMP/haifa-test-runs/critical-path-regression-plan.json"
            - name: Plan Critical Path regression suite (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: >-
                  .\test-config\scripts\run-suite.ps1 plan
                  --suite critical-path-regression-v1
                  --mode live
                  --output (Join-Path $env:HAIFA_TEST_RUN_ROOT 'critical-path-regression-plan.json')

    remote-suite-governance-plan:
        name: Remote plan (${{ matrix.suite }}, ${{ matrix.combination }}, ${{ matrix.os }})
        if: github.event_name == 'workflow_dispatch'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: critical-path-regression-v1
                      os: ubuntu-latest
                      combination: linux-primary
                      mode: live
                    - suite: critical-path-regression-v1
                      os: windows-latest
                      combination: windows-primary
                      mode: live
                    - suite: release-v1
                      os: ubuntu-latest
                      combination: linux-release
                      mode: release
                    - suite: release-v1
                      os: windows-latest
                      combination: windows-release
                      mode: release
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        env:
            HAIFA_TEST_MATRIX_COMBINATION: ${{ matrix.combination }}
            HAIFA_TEST_AGENT_PROFILE: coding-bailian-qwen37-flash-2026-07-15
        steps:
            - uses: actions/checkout@v4
            - name: Require private test-config deploy key
              shell: bash
              env:
                  TEST_CONFIG_SSH_KEY: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
              run: test -n "$TEST_CONFIG_SSH_KEY"
            - uses: actions/checkout@v4
              with:
                  repository: haifa-agent/haifa-agent-test-config
                  ssh-key: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
                  path: test-config
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Prepare external run root (Unix)
              if: runner.os != 'Windows'
              run: |
                  mkdir -p "$RUNNER_TEMP/haifa-test-runs"
                  echo "HAIFA_TEST_RUN_ROOT=$RUNNER_TEMP/haifa-test-runs" >> "$GITHUB_ENV"
            - name: Prepare external run root (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $runRoot = Join-Path $env:RUNNER_TEMP 'haifa-test-runs'
                  New-Item -ItemType Directory -Force -Path $runRoot | Out-Null
                  "HAIFA_TEST_RUN_ROOT=$runRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            - name: Plan Suite (Unix)
              if: runner.os != 'Windows'
              run: >-
                  bash test-config/scripts/run-suite.sh plan
                  --suite ${{ matrix.suite }}
                  --mode ${{ matrix.mode }}
                  --output "$RUNNER_TEMP/haifa-test-runs/${{ matrix.suite }}-plan.json"
            - name: Plan Suite (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: >-
                  .\test-config\scripts\run-suite.ps1 plan
                  --suite ${{ matrix.suite }}
                  --mode ${{ matrix.mode }}
                  --output (Join-Path $env:HAIFA_TEST_RUN_ROOT '${{ matrix.suite }}-plan.json')

    fast-cross-platform:
        name: Fast verify (${{ matrix.os }})
        if: >-
            github.event_name != 'workflow_dispatch' &&
            (github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/dev')
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Verify architecture and tests (Unix)
              if: runner.os != 'Windows'
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 2 -Pci-fast clean verify
            - name: Verify architecture and tests (Windows)
              if: runner.os == 'Windows'
              run: .\mvnw.cmd --batch-mode --no-transfer-progress -T 2 -Pci-fast clean verify

    integration:
        name: Integration verify
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        needs: fast-cross-platform
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Run Failsafe integration route
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 2 -Pci-integration-only verify

    release-artifacts:
        name: Release artifact contracts
        if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        needs: fast-cross-platform
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Build CLI release artifacts without rerunning tests
              run: >-
                  sh ./mvnw --batch-mode --no-transfer-progress -T 2
                  -pl :haifa-agent-cli -am -Prelease-artifacts verify
            - name: CLI entrypoint smoke
              run: java -jar haifa-agent-applications/haifa-agent-cli/target/haifa-agent-cli-0.1.0-SNAPSHOT.jar --help

    local-native-isolation-linux:
        name: Local Native isolation (linux)
        runs-on: ubuntu-latest
        needs: fast-cross-platform
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Install and record bubblewrap
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes bubblewrap
                  bwrap --version
            - name: Run Linux Local Native isolation IT
              run: >-
                  sh ./mvnw --batch-mode --no-transfer-progress
                  -pl :haifa-agent-sandbox-local-native -am
                  -Pci-integration-only
                  -Dit.test=LinuxBubblewrapSandboxIT
                  -Dfailsafe.failIfNoSpecifiedTests=false verify

    local-native-isolation-macos:
        name: Local Native isolation (macos)
        runs-on: macos-latest
        needs: fast-cross-platform
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Record Seatbelt capability
              run: |
                  sw_vers
                  test -x /usr/bin/sandbox-exec
            - name: Run macOS Local Native isolation IT
              run: >-
                  sh ./mvnw --batch-mode --no-transfer-progress
                  -pl :haifa-agent-sandbox-local-native -am
                  -Pci-integration-only
                  -Dit.test=MacSeatbeltSandboxIT
                  -Dfailsafe.failIfNoSpecifiedTests=false verify

    local-native-unsupported-windows:
        name: Local Native unsupported (windows)
        runs-on: windows-latest
        needs: fast-cross-platform
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Run Windows unsupported IT
              run: >-
                  .\mvnw.cmd --batch-mode --no-transfer-progress
                  -pl :haifa-agent-sandbox-local-native -am
                  -Pci-integration-only
                  "-Dit.test=LocalNativeWindowsIT"
                  "-Dfailsafe.failIfNoSpecifiedTests=false" verify

    dev-gate:
        name: Dev aggregate gate
        if: >-
            always() && github.event_name != 'workflow_dispatch' &&
            (github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/dev')
        runs-on: ubuntu-latest
        needs:
            - suite-governance-plan
            - fast-cross-platform
            - integration
            - release-artifacts
            - local-native-isolation-linux
            - local-native-isolation-macos
            - local-native-unsupported-windows
        steps:
            - name: Require every same-SHA gate to pass
              env:
                  SUITE_RESULT: ${{ needs.suite-governance-plan.result }}
                  FAST_RESULT: ${{ needs.fast-cross-platform.result }}
                  INTEGRATION_RESULT: ${{ needs.integration.result }}
                  ARTIFACT_RESULT: ${{ needs.release-artifacts.result }}
                  LINUX_RESULT: ${{ needs.local-native-isolation-linux.result }}
                  MACOS_RESULT: ${{ needs.local-native-isolation-macos.result }}
                  WINDOWS_RESULT: ${{ needs.local-native-unsupported-windows.result }}
              run: |
                  test "$SUITE_RESULT" = success
                  test "$FAST_RESULT" = success
                  test "$INTEGRATION_RESULT" = success
                  test "$ARTIFACT_RESULT" = success
                  test "$LINUX_RESULT" = success
                  test "$MACOS_RESULT" = success
                  test "$WINDOWS_RESULT" = success
