name: Dev Nightly Live

on:
    schedule:
        - cron: "17 18 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dev-nightly-live
    cancel-in-progress: false

jobs:
    slow-unit-tests:
        name: Slow unit tests (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: dev
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Run slow unit tests (Unix)
              if: runner.os != 'Windows'
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 2 -Pslow-tests test
            - name: Run slow unit tests (Windows)
              if: runner.os == 'Windows'
              run: .\mvnw.cmd --batch-mode --no-transfer-progress -T 2 -Pslow-tests test

    suite-governance-plan:
        name: Critical Path regression plan
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: dev
            - name: Require private test-config deploy key
              env:
                  TEST_CONFIG_SSH_KEY: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
              run: test -n "$TEST_CONFIG_SSH_KEY"
            - uses: actions/checkout@v4
              with:
                  repository: haifa-agent/haifa-agent-test-config
                  ssh-key: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
                  path: test-config
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Prepare external run root
              run: mkdir -p "$RUNNER_TEMP/haifa-test-runs"
            - name: Plan Critical Path regression suite without external calls
              env:
                  HAIFA_TEST_RUN_ROOT: ${{ runner.temp }}/haifa-test-runs
                  HAIFA_TEST_MATRIX_COMBINATION: linux-primary
                  HAIFA_TEST_AGENT_PROFILE: coding-bailian-qwen37-flash-2026-07-15
              run: >-
                  bash test-config/scripts/run-suite.sh plan
                  --suite critical-path-regression-v1
                  --mode live
                  --output "$RUNNER_TEMP/haifa-test-runs/critical-path-regression-plan.json"

    configured-provider-live-smoke:
        name: Configured provider live smoke suite
        needs: suite-governance-plan
        runs-on: ubuntu-latest
        timeout-minutes: 45
        environment: ai-live-test
        env:
            DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
            ALIYUN_IQS_API_KEY: ${{ secrets.ALIYUN_IQS_API_KEY }}
            BAILIAN_WORKSPACE_ID: ${{ secrets.BAILIAN_WORKSPACE_ID }}
            BAILIAN_ENDPOINT: ${{ secrets.BAILIAN_ENDPOINT }}
            HAIFA_TEST_MATRIX_COMBINATION: linux-primary
            HAIFA_TEST_AGENT_PROFILE: coding-bailian-qwen37-flash-2026-07-15
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: dev
            - name: Require private test-config deploy key
              env:
                  TEST_CONFIG_SSH_KEY: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
              run: test -n "$TEST_CONFIG_SSH_KEY"
            - uses: actions/checkout@v4
              with:
                  repository: haifa-agent/haifa-agent-test-config
                  ssh-key: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
                  path: test-config
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Require configured service credentials
              run: test -n "$DASHSCOPE_API_KEY" && test -n "$ALIYUN_IQS_API_KEY" && test -n "$BAILIAN_WORKSPACE_ID" && test -n "$BAILIAN_ENDPOINT"
            - name: Prepare external run root
              run: |
                  echo "HAIFA_TEST_RUN_ROOT=$RUNNER_TEMP/haifa-test-runs" >> "$GITHUB_ENV"
                  mkdir -p "$RUNNER_TEMP/haifa-test-runs"
            - name: Plan reviewed Critical Path smoke suite
              run: >-
                  bash test-config/scripts/run-suite.sh plan
                  --suite critical-path-smoke-v1
                  --mode live
                  --output "$RUNNER_TEMP/haifa-test-runs/critical-path-smoke-plan.json"
            - name: Execute approved Critical Path smoke suite
              run: >-
                  bash test-config/scripts/run-suite.sh run
                  --plan "$RUNNER_TEMP/haifa-test-runs/critical-path-smoke-plan.json"
                  --approve-budget 5.0
            - name: Upload redacted suite evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: critical-path-smoke-evidence
                  path: ${{ runner.temp }}/haifa-test-runs
                  if-no-files-found: warn
                  retention-days: 7
