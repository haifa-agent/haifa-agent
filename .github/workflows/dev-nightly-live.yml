name: Dev Nightly Live

on:
    schedule:
        - cron: "17 18 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dev-nightly-live
    cancel-in-progress: false

jobs:
    slow-unit-tests:
        name: Slow unit tests (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: dev
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Run slow unit tests (Unix)
              if: runner.os != 'Windows'
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 2 -Pslow-tests test
            - name: Run slow unit tests (Windows)
              if: runner.os == 'Windows'
              run: .\mvnw.cmd --batch-mode --no-transfer-progress -T 2 -Pslow-tests test

    # Suite governance plan and configured provider live smoke jobs are
    # temporarily removed: the suite runner JAR was deleted by the testing
    # architecture simplification. They will be reintroduced by the
    # autonomous-delivery capability ladder work (issue #34, Slice 4).
