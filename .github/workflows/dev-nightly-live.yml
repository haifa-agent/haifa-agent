name: Dev Nightly Live

on:
    schedule:
        - cron: "17 18 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dev-nightly-live
    cancel-in-progress: false

jobs:
    suite-governance-plan:
        name: Nightly Suite plan
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: dev
            - name: Require private test-config deploy key
              env:
                  TEST_CONFIG_SSH_KEY: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
              run: test -n "$TEST_CONFIG_SSH_KEY"
            - uses: actions/checkout@v4
              with:
                  repository: haifa-agent/haifa-agent-test-config
                  ssh-key: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
                  path: test-config
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Prepare external run root
              run: mkdir -p "$RUNNER_TEMP/haifa-test-runs"
            - name: Plan Nightly Suite without external calls
              env:
                  HAIFA_TEST_RUN_ROOT: ${{ runner.temp }}/haifa-test-runs
                  HAIFA_TEST_MATRIX_COMBINATION: linux-primary
                  HAIFA_TEST_AGENT_PROFILE: coding-bailian-qwen37-max
              run: bash test-config/scripts/run-suite.sh nightly-v1

    configured-provider-live-smoke:
        name: Configured provider live smoke suite
        needs: suite-governance-plan
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: ai-live-test
        env:
            DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
            ALIYUN_IQS_API_KEY: ${{ secrets.ALIYUN_IQS_API_KEY }}
            BAILIAN_WORKSPACE_ID: ${{ secrets.BAILIAN_WORKSPACE_ID }}
            BAILIAN_ENDPOINT: ${{ secrets.BAILIAN_ENDPOINT }}
            HAIFA_TEST_APPROVED_MAX_ESTIMATED_COST_USD: "3.0"
            HAIFA_TEST_APPROVED_PLAN_SHA256: ${{ vars.HAIFA_NIGHTLY_PROVIDER_SMOKE_PLAN_SHA256 }}
            HAIFA_TEST_MATRIX_COMBINATION: linux-primary
            HAIFA_TEST_AGENT_PROFILE: coding-bailian-qwen37-max
            HAIFA_TEST_RUN_ROOT: ${{ runner.temp }}/haifa-test-runs
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: dev
            - name: Require private test-config deploy key
              env:
                  TEST_CONFIG_SSH_KEY: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
              run: test -n "$TEST_CONFIG_SSH_KEY"
            - uses: actions/checkout@v4
              with:
                  repository: haifa-agent/haifa-agent-test-config
                  ssh-key: ${{ secrets.HAIFA_TEST_CONFIG_SSH_KEY }}
                  path: test-config
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Require configured service credentials
              run: test -n "$DASHSCOPE_API_KEY" && test -n "$ALIYUN_IQS_API_KEY" && test -n "$BAILIAN_WORKSPACE_ID" && test -n "$BAILIAN_ENDPOINT"
            - name: Prepare external run root
              run: mkdir -p "$HAIFA_TEST_RUN_ROOT"
            - name: Execute reviewed provider smoke suite
              run: bash test-config/scripts/run-suite.sh nightly-provider-smoke-v1 --execute
            - name: Upload redacted suite evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: nightly-provider-smoke-evidence
                  path: ${{ runner.temp }}/haifa-test-runs
                  if-no-files-found: warn
                  retention-days: 7
