name: Coding Agent Installers

on:
    pull_request:
        branches: [dev]
        paths:
            - ".github/workflows/coding-installers.yml"
            - ".github/workflows/main-release.yml"
            - "dist-support/**"
            - "haifa-agent-applications/haifa-agent-cli/**"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: coding-installers-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    install:
        name: Clean install (${{ matrix.platform }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux-x64
                      runner: ubuntu-24.04
                    - platform: windows-x64
                      runner: windows-latest
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - name: Build CLI (Linux)
              if: runner.os == 'Linux'
              run: sh ./mvnw --batch-mode --no-transfer-progress -T 2 -pl :haifa-agent-cli -am -Prelease-artifacts verify
            - name: Build CLI (Windows)
              if: runner.os == 'Windows'
              run: .\mvnw.cmd --batch-mode --no-transfer-progress -T 2 -pl :haifa-agent-cli -am -Prelease-artifacts verify
            - name: Check distribution contracts
              if: runner.os == 'Linux'
              run: python -m unittest scripts.tests.test_release_distributions scripts.tests.test_smoke_distributions
            - name: Package Coding Agent
              run: python dist-support/scripts/package_distributions.py ca:${{ matrix.platform }}
            - name: Install and run haifa from an empty user directory
              run: python dist-support/scripts/smoke_coding_install.py
